apiVesion:: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: mysql
spec:
  serviceName: "mysql"
  replicas: 3
  clusterIP: None
  selector:
    matchLabels:
      app: todoapp
  spec:
    containers:
    - name: mysql
      image: mysql:8.0
      resources:
        requests:
          cpu: 500m
          memory: "1Gi"
        limits:
          cpu: 1000m
          memory: "2Gi"
      ports:
      - containerPort: 3306
        name: mysql
      env:
      - name: MYSQL_ROOT_PASSWORD
        valueFrom:
          secretKeyRef:
            name: mysql-secret
            key: MYSQL_ROOT_PASSWORD
      - name: MYSQL_USER
        valueFrom:
          secretKeyRef:
            name: mysql-secret
            key: MYSQL_USER
      - name: MYSQL_PASSWORD
        valueFrom:
          secretKeyRef:
            name: mysql-secret
            key: MYSQL_PASSWORD
      livenessProbe:
        exec:
          command: ["mysqladmin", "ping"]
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
      readinessProbe:
        exec:
          command: ["mysqladmin", "ping"]
        initialDelaySeconds: 5
        periodSeconds: 2
        timeoutSeconds: 1
    volumes:
    - name: mysql-config
      configMap:
        name: mysql-config